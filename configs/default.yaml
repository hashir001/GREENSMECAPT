application:
  name: GREENSMECAPT
  environment: development

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  sample_data: data/samples

decision_support:
  readiness:
    method: fuzzy_dematel
    role: causal_interpretation
    calibration_status: requires_expert_calibration
    driver_specification: config/dematel_driver_specification.development.json
    subdriver_specification: config/dematel_specification.development.json
    maximum_directional_judgments_per_expert: 54
  performance:
    weighting_method: provisional_policy
    ranking_methods:
      - topsis
      - fuzzy_topsis
      - electre_iii
